services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:-crm_owner}
      # Read by deploy/postgres/init/01-roles.sh on first start; there is no default.
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-crm_app}
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_owner -d crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    # .env.dev is optional (gitignored, local-only) - every value it can set already
    # has a safe dev fallback in application.properties/application-dev.properties.
    env_file:
      - path: .env.dev
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # Inside the compose network the api container reaches Postgres by service name, not localhost.
      DB_HOST: postgres
      # Same idea for MinIO: the api calls it by service name, while presigned links
      # handed to the browser must point at the host-published port.
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: http://localhost:9000
      REDIS_HOST: redis
    ports: ["8080:8080"] # exposed for the frontend (dev server on :5173) to call
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4.2-alpine
    # appendonly so a restart doesn't bring logged-out tokens back to life
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-devredis}"]
    ports: ["6379:6379"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-devredis}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # MinIO stopped publishing new community images; pinned to the last release we have.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports: ["9000:9000", "9001:9001"] # S3 API (presigned links) and web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
  minio_data:
  redis_data:

networks:
  default:
    name: crm-network
