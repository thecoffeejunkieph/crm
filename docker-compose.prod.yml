services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_USER: ${DB_USERNAME:-admin}
      MYSQL_PASSWORD: ${DB_PASSWORD:-admin}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-admin}
      MYSQL_DATABASE: crm_db
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-admin}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    # .env.dev is optional (gitignored, local-only) - every value it can set already
    # has a safe dev fallback in application.properties/application-dev.properties.
    env_file:
      - path: .env.dev
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # Overrides .env.dev's DB_URL: inside the compose network the api container
      # reaches MySQL via the service name "mysql", not localhost.
      DB_URL: jdbc:mysql://mysql:3306/crm_db
      # Same idea for MinIO: the api calls it by service name, while presigned links
      # handed to the browser must point at the host-published port.
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: http://localhost:9000
      REDIS_HOST: redis
    ports: ["8080:8080"] # exposed for the frontend (dev server on :5173) to call
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4.2-alpine
    # appendonly so a restart doesn't bring logged-out tokens back to life
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-devredis}"]
    ports: ["6379:6379"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-devredis}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # MinIO stopped publishing new community images; pinned to the last release we have.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports: ["9000:9000", "9001:9001"] # S3 API (presigned links) and web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  minio_data:
  redis_data:

networks:
  default:
    name: crm-network
