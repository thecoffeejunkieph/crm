services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: crm_db
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-padmin" ]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host - only the api container talks to this, over the
    # compose network. Keep the DB off the public internet.

  api:
    build: .
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT}
      COOKIE_SECURE: true
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      APP_BASE_URL: ${APP_BASE_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      QUOTATION_RESPONSE_SECRET: ${QUOTATION_RESPONSE_SECRET}
      INVOICE_PAYMENT_SECRET: ${INVOICE_PAYMENT_SECRET}
      INVOICE_BANK_NAME: ${INVOICE_BANK_NAME}
      INVOICE_BANK_ACCOUNT_NAME: ${INVOICE_BANK_ACCOUNT_NAME}
      INVOICE_BANK_ACCOUNT_NUMBER: ${INVOICE_BANK_ACCOUNT_NUMBER}
      INVOICE_BANK_SWIFT_CODE: ${INVOICE_BANK_SWIFT_CODE}
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`api.thecoffeejunkie.ph`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls.certresolver=letsencrypt
      - traefik.http.services.api.loadbalancer.server.port=8080
      - traefik.http.routers.api.tls=true
    # Not published to the host - Traefik (running as its own stack on the VPS,
    # watching the external "traefik-proxy" network) is the only thing that
    # talks to :8080, routed in via the labels above.

  minio:
    # MinIO stopped publishing new community images; pinned to the last release we have.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default
      - dokploy-network
    # Only the S3 API is routed, so browsers can follow presigned links. Every object is
    # private; a link works only while its signature is valid. The console stays unexposed.
    labels:
      - traefik.enable=true
      - traefik.http.routers.files.rule=Host(``)
      - traefik.http.routers.files.entrypoints=websecure
      - traefik.http.routers.files.tls.certresolver=letsencrypt
      - traefik.http.routers.files.tls=true
      - traefik.http.services.files.loadbalancer.server.port=9000

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    # appendonly so a restart doesn't bring logged-out tokens back to life
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published and not on the Traefik network - only the api talks to it.

  # One-off copy of the old on-disk uploads into the bucket, keeping their relative paths
  # (which is what the V4 Flyway migration turns the stored DB paths into):
  #   docker compose --profile migrate run --rm storage-migrate
  # Once the files are verified in the bucket, delete this service and the api_storage volume.
  storage-migrate:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z # ships the mc client
    profiles: ["migrate"]
    environment:
      MC_HOST_crm: http://${MINIO_ACCESS_KEY}:${MINIO_SECRET_KEY}@minio:9000
    entrypoint: ["sh", "-c", "mc mb --ignore-existing crm/${MINIO_BUCKET:-crm} && mc mirror /old-storage crm/${MINIO_BUCKET:-crm}"]
    volumes:
      - api_storage:/old-storage:ro
    depends_on:
      minio:
        condition: service_healthy

volumes:
  mysql_data:
  minio_data:
  redis_data:
  api_storage: # legacy uploads; remove after storage-migrate has run

networks:
  dokploy-network:
    external: true