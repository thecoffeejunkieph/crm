services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?}
      # Read by deploy/postgres/init/01-roles.sh on first start; there is no default.
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_owner -d crm"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host - only the api container talks to this, over the
    # compose network. Keep the DB off the public internet.

  api:
    build: .
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_OWNER_USERNAME: crm_owner
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?}
      DB_APP_USERNAME: crm_app
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SESSION_COOKIE_SECURE: true
      # Subdomains of this host can read the XSRF-TOKEN cookie, so every subdomain must be trusted.
      CSRF_COOKIE_DOMAIN: ${CSRF_COOKIE_DOMAIN:-thecoffeejunkie.ph}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: crm
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      APP_BASE_URL: ${APP_BASE_URL}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`api.thecoffeejunkie.ph`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls.certresolver=letsencrypt
      - traefik.http.services.api.loadbalancer.server.port=8080
      - traefik.http.routers.api.tls=true
    # Port 8081 (actuator health) is neither published nor routed; probe it from inside the network.
    # Not published to the host - Traefik (running as its own stack on the VPS,
    # watching the external "traefik-proxy" network) is the only thing that
    # talks to :8080, routed in via the labels above.

  minio:
    # MinIO stopped publishing new community images; pinned to the last release we have.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data
    environment:
      # Same vars the api uses - the api logs in as root, so these must match.
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default
      - dokploy-network
    # Only the S3 API is routed, so browsers can follow presigned links. Every object is
    # private; a link works only while its signature is valid. The console stays unexposed.
    labels:
      - traefik.enable=true
      - traefik.http.routers.files.rule=Host(`${MINIO_PUBLIC_HOST}`)
      - traefik.http.routers.files.entrypoints=websecure
      - traefik.http.routers.files.tls.certresolver=letsencrypt
      - traefik.http.routers.files.tls=true
      - traefik.http.services.files.loadbalancer.server.port=9000

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    # appendonly so a restart doesn't bring logged-out tokens back to life
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published and not on the Traefik network - only the api talks to it.

  # One-off copy of the old on-disk uploads into the bucket, keeping their relative paths
  # (which is what the V4 Flyway migration turns the stored DB paths into):
  #   docker compose --profile migrate run --rm storage-migrate
  # Once the files are verified in the bucket, delete this service and the api_storage volume.
  storage-migrate:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z # ships the mc client
    profiles: ["migrate"]
    environment:
      MC_HOST_crm: http://${MINIO_ACCESS_KEY}:${MINIO_SECRET_KEY}@minio:9000
    entrypoint: ["sh", "-c", "mc mb --ignore-existing crm/${MINIO_BUCKET} && mc mirror /old-storage crm/${MINIO_BUCKET}"]
    volumes:
      - api_storage:/old-storage:ro
    depends_on:
      minio:
        condition: service_healthy

volumes:
  pg_data:
  minio_data:
  redis_data:
  api_storage: # legacy uploads; remove after storage-migrate has run

networks:
  dokploy-network:
    external: true