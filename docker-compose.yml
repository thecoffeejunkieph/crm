version: '3.9'
services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: crm_db
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql

#  api:
#    build: .
#    ports: ["8080:8080"]
#    depends_on: [mysql]

volumes:
  mysql_data: