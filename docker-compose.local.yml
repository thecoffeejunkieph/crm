# Local stack: everything self-contained, no .env needed, no Traefik.
#   docker compose -f docker-compose.local.yml up -d --build
# API http://localhost:8080 · MinIO console http://localhost:9001 · Postgres localhost:5432 · Mailpit http://localhost:8025
# Secrets below are random local-only values - never reuse them anywhere else.
name: crm-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm_owner
      POSTGRES_PASSWORD: crm_owner_local_pw
      # Read by deploy/postgres/init/01-roles.sh on first start; there is no default.
      DB_APP_PASSWORD: crm_app_local_pw
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_owner -d crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # UI + API

  api:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_OWNER_USERNAME: crm_owner
      DB_OWNER_PASSWORD: crm_owner_local_pw
      DB_APP_USERNAME: crm_app
      DB_APP_PASSWORD: crm_app_local_pw
      ENCRYPTION_KEY: local-only-encryption-key-change-nothing
      BOOTSTRAP_ADMIN_EMAIL: admin@local.test
      ENCRYPTION_SALT: ed34adf22dd98ca69917bf039754b685
      SESSION_COOKIE_SECURE: "false" # plain HTTP locally; browsers drop Secure cookies
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: http://localhost:9000
      MINIO_ACCESS_KEY: crm-local
      MINIO_SECRET_KEY: OxXyRZqdfwsFHcanfJmQwuab7_w1r30wgKwqA3Vp
      REDIS_HOST: redis
      REDIS_PASSWORD: kKXLPwDIy953G9apHC4BKWxvIgLbwPZ1
      APP_BASE_URL: http://localhost:8080
      APP_FRONTEND_URL: http://localhost:5173
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      MAIL_HOST: mailpit # dev profile sends to Mailpit on 1025
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      # The api uses the root user directly; the bucket is created by the api on startup.
      MINIO_ROOT_USER: crm-local
      MINIO_ROOT_PASSWORD: OxXyRZqdfwsFHcanfJmQwuab7_w1r30wgKwqA3Vp
    ports:
      - "9000:9000" # S3 API - browsers follow presigned links here
      - "9001:9001" # console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "kKXLPwDIy953G9apHC4BKWxvIgLbwPZ1"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "kKXLPwDIy953G9apHC4BKWxvIgLbwPZ1", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
  minio_data:
  redis_data:
