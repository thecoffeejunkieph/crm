app.frontend-url=http://app.test
spring.mail.host=localhost
spring.mail.port=3025

# Dummy values so MinIO-dependent beans build; StorageServiceIT brings its own container.
app.minio.endpoint=http://localhost:9000
app.minio.public-endpoint=http://localhost:9000
app.minio.access-key=test
app.minio.secret-key=test
app.cors.allowed-origins=http://app.test
encryption.salt=test-salt-test-salt-test-salt-1234
app.security.encryption-key=test-encryption-key-for-tests
spring.data.redis.password=

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
management.server.port=-1
# Tests mock JavaMailSender, which the mail health contributor cannot wrap.
management.health.mail.enabled=false

# Log file for LogLevelIT; kept out of the project root.
logging.file.name=build/test-logs/crm.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [reqId=%X{requestId}%X{jobId}] %logger{36} - %msg%n
