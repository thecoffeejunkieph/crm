# Staging. No hardcoded secrets or fallbacks here - every sensitive/environment-specific
# value must be supplied via env var, so a missing one fails startup loudly instead of
# silently falling back to a dev/prod value. See .env.staging.example for the full list.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

auth.secret-key=${AUTH_SECRET_KEY}
encryption.salt=${ENCRYPTION_SALT}

# Staging is served over HTTPS, so the jwt cookie can be Secure.
auth.cookie.secure=${COOKIE_SECURE:true}

app.storage.root-dir=${PDF_STORAGE_DIR:/data/storage}

# Public base URL of this API, used to build the absolute accept/reject links embedded
# in outgoing quotation emails (must be reachable by the customer clicking the link).
app.base-url=${APP_BASE_URL}

# Comma-separated list of origins allowed to call this API with credentials (see CorsConfig).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

quotation.response.secret-key=${QUOTATION_RESPONSE_SECRET}
invoice.payment.secret-key=${INVOICE_PAYMENT_SECRET}

# Bank account shown on generated invoice PDFs for customer payment.
app.company.bank.name=${INVOICE_BANK_NAME}
app.company.bank.account-name=${INVOICE_BANK_ACCOUNT_NAME}
app.company.bank.account-number=${INVOICE_BANK_ACCOUNT_NUMBER}
app.company.bank.swift-code=${INVOICE_BANK_SWIFT_CODE}
