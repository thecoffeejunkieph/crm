<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<style>@page { size: A4; margin: 16mm 15mm; }</style>
</head>
<body class="text-[10pt] leading-snug text-gray-700">
<header class="flex items-start justify-between gap-6 border-b-2 border-gray-900 pb-3">
  <div th:replace="~{fragments/parts :: company}"></div>
  <div class="text-right">
    <div class="text-[17pt] font-bold tracking-tight text-gray-900" th:text="${pickup != ''} ? 'PICKUP SLIP' : 'DELIVERY ORDER'">DELIVERY ORDER</div>
    <div>No. <span class="font-semibold text-gray-900" th:text="${number}">DO-00000</span></div>
    <div>Date: <span th:text="${date}">date</span></div>
    <div>Status: <span th:text="${status}">PICKING</span></div>
  </div>
</header>

<section class="my-4 grid grid-cols-2 gap-4 rounded border border-gray-300 p-3">
  <div>
    <div><b class="text-gray-900">Customer:</b> <span th:text="${customer}">Name</span></div>
    <div th:if="${shipTo != ''}">Ship to: <span th:text="${shipTo}">Address</span></div>
  </div>
  <div>
    <div>Order: <span th:text="${orderNumber}">SO-00</span></div>
    <div>From: <span th:text="${warehouse}">Warehouse</span></div>
    <div th:if="${dispatched != ''}">Dispatched: <span th:text="${dispatched}">date</span></div>
    <div th:if="${delivered != ''}"><span th:text="${pickup != ''} ? 'Picked up' : 'Delivered'">Delivered</span>: <span th:text="${delivered}">date</span></div>
  </div>
</section>

<table class="w-full">
  <thead>
    <tr class="border-b border-gray-500 bg-gray-100 text-left text-gray-900">
      <th class="p-1.5">SKU</th><th class="p-1.5">Description</th><th class="p-1.5 text-right">Qty</th>
      <th class="p-1.5">Unit</th><th class="p-1.5 text-right">Picked</th>
    </tr>
  </thead>
  <tbody>
    <tr th:each="l : ${lines}" class="break-inside-avoid border-b border-gray-200">
      <td class="p-1.5" th:text="${l.sku}">SKU</td>
      <td class="p-1.5" th:text="${l.description}">Item</td>
      <td class="p-1.5 text-right" th:text="${l.qty}">1</td>
      <td class="p-1.5" th:text="${l.unit}">PC</td>
      <td class="p-1.5 text-right" th:text="${l.picked}">0</td>
    </tr>
  </tbody>
</table>

<div class="mt-14 flex break-inside-avoid gap-10">
  <div th:replace="~{fragments/parts :: signature('Released by', '')}"></div>
  <div th:replace="~{fragments/parts :: signature('Received by (name and signature)', ${receiverName})}"></div>
</div>
</body>
</html>
