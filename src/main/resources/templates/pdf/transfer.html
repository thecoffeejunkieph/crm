<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<style>@page { size: A4; margin: 20mm 18mm; }</style>
</head>
<body class="text-[10pt] leading-relaxed text-body">
<header th:replace="~{fragments/parts :: letterhead('STOCK TRANSFER', ${number})}"></header>

<section class="mb-12 grid grid-cols-[1fr_1fr_50mm] gap-10">
  <div th:replace="~{fragments/parts :: company}"></div>
  <div class="space-y-4">
    <div>
      <div class="mb-1 text-[8.5pt] text-muted">From</div>
      <div class="font-semibold text-ink" th:text="${from}">Warehouse</div>
    </div>
    <div>
      <div class="mb-1 text-[8.5pt] text-muted">To</div>
      <div class="font-semibold text-ink" th:text="${to}">Warehouse</div>
    </div>
  </div>
  <dl class="space-y-2">
    <div class="flex justify-between gap-4"><dt class="text-muted">Date</dt><dd class="text-ink" th:text="${date}">date</dd></div>
    <div class="flex justify-between gap-4"><dt class="text-muted">Status</dt><dd class="text-ink" th:text="${status}">DRAFT</dd></div>
    <div th:if="${createdBy != ''}" class="flex justify-between gap-4"><dt class="text-muted">Prepared by</dt><dd class="text-right text-ink" th:text="${createdBy}">Name</dd></div>
    <div th:if="${dispatched != ''}" class="flex justify-between gap-4"><dt class="text-muted">Dispatched</dt><dd class="text-ink" th:text="${dispatched}">date</dd></div>
    <div th:if="${received != ''}" class="flex justify-between gap-4"><dt class="text-muted">Received</dt><dd class="text-ink" th:text="${received}">date</dd></div>
  </dl>
</section>

<table class="w-full">
  <thead>
    <tr class="border-b border-ink text-left text-[8.5pt] text-muted">
      <th class="pb-2.5 font-normal">SKU</th><th class="pb-2.5 pl-4 font-normal">Product</th><th class="pb-2.5 pl-4 text-right font-normal">Qty</th>
      <th class="pb-2.5 pl-3 font-normal">Unit</th><th class="pb-2.5 pl-4 text-right font-normal">Received</th>
    </tr>
  </thead>
  <tbody>
    <tr th:each="l : ${lines}" class="break-inside-avoid border-b border-line">
      <td class="py-3" th:text="${l.sku}">SKU</td>
      <td class="py-3 pl-4 text-ink" th:text="${l.name}">Item</td>
      <td class="py-3 pl-4 text-right tabular-nums" th:text="${l.qty}">1</td>
      <td class="py-3 pl-3" th:text="${l.unit}">PC</td>
      <td class="py-3 pl-4 text-right tabular-nums" th:text="${l.received}"></td>
    </tr>
  </tbody>
</table>

<section th:if="${notes != ''}" class="mt-10 break-inside-avoid">
  <div class="mb-2 text-[8.5pt] text-muted">Notes</div>
  <div class="max-w-[150mm] whitespace-pre-line" th:text="${notes}">notes</div>
</section>

<div class="mt-24 flex break-inside-avoid gap-16">
  <div th:replace="~{fragments/parts :: signature('Released by', '')}"></div>
  <div th:replace="~{fragments/parts :: signature('Received by', '')}"></div>
</div>
</body>
</html>
