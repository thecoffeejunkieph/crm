<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="company">
  <div class="text-[15pt] font-bold tracking-tight text-gray-900" th:text="${company.name}">Company</div>
  <div class="mt-0.5 text-gray-600" th:text="${company.address}">Address</div>
  <div class="text-gray-600">VAT Reg. TIN: <span th:text="${company.tin}">TIN</span></div>
</div>

<table th:fragment="totals(grandLabel)" class="mt-3 ml-auto w-[55%] break-inside-avoid">
  <tr><td class="px-2 py-0.5">VATable Sales</td><td class="px-2 py-0.5 text-right whitespace-nowrap" th:text="|PHP ${#numbers.formatDecimal(totals.vatableSales, 1, 'COMMA', 2, 'POINT')}|">0</td></tr>
  <tr><td class="px-2 py-0.5">VAT (12%)</td><td class="px-2 py-0.5 text-right whitespace-nowrap" th:text="|PHP ${#numbers.formatDecimal(totals.vat, 1, 'COMMA', 2, 'POINT')}|">0</td></tr>
  <tr><td class="px-2 py-0.5">VAT-Exempt Sales</td><td class="px-2 py-0.5 text-right whitespace-nowrap" th:text="|PHP ${#numbers.formatDecimal(totals.vatExemptSales, 1, 'COMMA', 2, 'POINT')}|">0</td></tr>
  <tr><td class="px-2 py-0.5">Zero-Rated Sales</td><td class="px-2 py-0.5 text-right whitespace-nowrap" th:text="|PHP ${#numbers.formatDecimal(totals.zeroRatedSales, 1, 'COMMA', 2, 'POINT')}|">0</td></tr>
  <tr><td class="px-2 py-0.5">Shipping (incl. in VATable)</td><td class="px-2 py-0.5 text-right whitespace-nowrap" th:text="|PHP ${#numbers.formatDecimal(totals.shippingFee, 1, 'COMMA', 2, 'POINT')}|">0</td></tr>
  <tr class="border-t-2 border-gray-900 font-bold text-gray-900"><td class="px-2 py-1.5" th:text="${grandLabel}">Total</td><td class="px-2 py-1.5 text-right whitespace-nowrap" th:text="|PHP ${#numbers.formatDecimal(totals.total, 1, 'COMMA', 2, 'POINT')}|">0</td></tr>
</table>

<div th:fragment="signature(label, name)" class="flex-1">
  <div class="h-10 border-b border-gray-500 text-center leading-[3.25rem]" th:text="${name}"></div>
  <div class="mt-1 text-[8.5pt] text-gray-600" th:text="${label}">Label</div>
</div>

</body>
</html>
