<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Quotation</title>
    <th:block th:replace="~{fragments/bootstrap :: styles}"></th:block>
    <style type="text/css">
        @page {
            size: A4;
            margin: 28pt 36pt;
        }

        .header-table {
            width: 100%;
        }

        .logo {
            width: 1.5in;
            height: auto;
        }

        .company-info {
            width: 50%;
        }

        .meta-table td {
            width: 33.33%;
            padding-bottom: 6pt;
        }

        .meta-label {
            text-transform: uppercase;
            letter-spacing: .04em;
            color: #6c757d;
        }
    </style>
</head>
<body>

<table class="header-table mb-3">
    <tr>
        <td style="width:50%;">
            <img th:src="${logoDataUri}" class="logo" alt="Logo"/>
        </td>
        <td style="width:50%" class="company-info text-end align-top">
            <div class="fw-bold" th:text="${companyName}">Company Name</div>
            <div class="small text-muted" th:each="line : ${companyAddressLines}" th:text="${line}">Address line</div>
            <div class="small text-muted" th:text="${companyEmail} + ' | ' + ${companyPhone}">email | phone</div>
        </td>
    </tr>
</table>

<h1>QUOTATION</h1>
<div class="text-muted mb-3" th:text="'#' + ${quotationNumber}">#QUO-0001</div>

<table class="table meta-table mb-3">
    <tr>
        <td>
            <span class="small meta-label d-block">Quote Date</span>
            <span th:text="${quoteDate}">-</span>
        </td>
        <td>
            <span class="small meta-label d-block">Expiry Date</span>
            <span th:text="${expiryDate}">-</span>
        </td>
        <td></td>
    </tr>
</table>

<h6>Bill To</h6>
<div th:each="line : ${billToLines}" th:text="${line}">Bill to line</div>

<table class="table items-table mb-3 mt-3">
    <thead class="table-dark">
    <tr>
        <th style="width:35%;">Product</th>
        <th style="width:10%;">Qty</th>
        <th style="width:15%;">Unit Price</th>
        <th style="width:15%;">Discount</th>
        <th style="width:15%;">Total</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${items}">
        <td th:text="${item.product}">Product</td>
        <td class="text-center" th:text="${item.quantity}">0</td>
        <td class="text-end" th:text="${item.unitPrice}">0.00</td>
        <td class="text-end" th:text="${item.discount}">0.00</td>
        <td class="text-end" th:text="${item.total}">0.00</td>
    </tr>
    </tbody>
</table>

<table class="table mb-3" style="width:45%; margin-left:auto;">
    <tr>
        <td class="text-muted">Subtotal</td>
        <td class="text-end" th:text="${subtotal}">0.00</td>
    </tr>
    <tr th:if="${shippingCharges != null}">
        <td class="text-muted">Shipping</td>
        <td class="text-end" th:text="${shippingCharges}">0.00</td>
    </tr>
    <tr th:if="${discount != null}">
        <td class="text-muted">Discount</td>
        <td class="text-end" th:text="${discount}">0.00</td>
    </tr>
    <tr>
        <td class="fw-bold border-top" style="padding-top:10pt;">Total Amount</td>
        <td class="text-end fw-bold border-top" style="padding-top:10pt;" th:text="${totalAmount}">0.00</td>
    </tr>
</table>

<div class="mb-4" th:if="${not #lists.isEmpty(notesLines)}">
    <h6>Notes</h6>
    <div th:each="line : ${notesLines}" th:text="${line}">Notes line</div>
</div>

<div th:if="${not #lists.isEmpty(termsLines)}">
    <h6>Terms and Conditions</h6>
    <div th:each="line : ${termsLines}" th:text="${line}">Terms line</div>
</div>

</body>
</html>
