<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<style>@page { size: 62mm 40mm; margin: 2mm; }</style>
</head>
<body>
<div th:each="l : ${labels}" class="h-[35.5mm] overflow-hidden break-after-page last:break-after-auto">
  <div class="flex items-center gap-[2mm]">
    <img class="size-[24mm] shrink-0" th:src="${l.qr}" src="" alt="QR"/>
    <div class="min-w-0 text-[11pt] leading-tight font-bold break-words" th:text="${l.number}">NUMBER</div>
  </div>
  <div class="mt-[1.5mm] text-[8pt] leading-tight" th:text="${l.name}">Name</div>
</div>
</body>
</html>
