<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<style>@page { size: A4; margin: 20mm 18mm; }</style>
</head>
<!-- The PNG is a screenshot, which ignores @page margins, so the body pads itself to the same margins there. -->
<body class="text-[10pt] leading-relaxed text-body bg-white px-[18mm] py-[20mm] print:p-0">
<header th:replace="~{fragments/parts :: letterhead('PURCHASE ORDER', ${number})}"></header>

<div th:if="${draft != ''}" class="-mt-8 mb-8 text-right">
  <span class="rounded-[1mm] border border-ink px-2 py-0.5 text-[8.5pt] font-semibold tracking-widest text-ink">DRAFT</span>
</div>

<section class="mb-12 grid grid-cols-[1fr_1fr_50mm] gap-10">
  <div th:replace="~{fragments/parts :: company}"></div>
  <div>
    <div class="mb-2 text-[8.5pt] text-muted">Supplier</div>
    <div class="font-semibold text-ink" th:text="${supplier.name}">Name</div>
    <div class="mt-1" th:if="${supplier.contact != ''}" th:text="${supplier.contact}">Contact</div>
    <div class="mt-1" th:if="${supplier.phone != ''}" th:text="${supplier.phone}">Phone</div>
    <div class="mt-1" th:if="${supplier.email != ''}" th:text="${supplier.email}">Email</div>
    <div class="mt-1" th:if="${supplier.address != ''}" th:text="${supplier.address}">Address</div>
  </div>
  <dl class="space-y-2">
    <div class="flex justify-between gap-4"><dt class="text-muted">Date</dt><dd class="text-ink" th:text="${date}">date</dd></div>
    <div class="flex justify-between gap-4"><dt class="text-muted">Status</dt><dd class="text-ink" th:text="${status}">DRAFT</dd></div>
    <div th:if="${expectedOn != ''}" class="flex justify-between gap-4"><dt class="text-muted">Expected</dt><dd class="text-ink" th:text="${expectedOn}">date</dd></div>
    <div class="flex justify-between gap-4"><dt class="text-muted">Deliver to</dt><dd class="text-right text-ink" th:text="${warehouse}">Warehouse</dd></div>
  </dl>
</section>

<section th:if="${terms != ''}" class="mb-10 break-inside-avoid rounded-[1.5mm] border border-line px-5 py-3">
  <span class="mr-3 text-[8.5pt] text-muted">Terms</span><span class="text-ink" th:text="${terms}">terms</span>
</section>

<table class="w-full">
  <thead>
    <tr class="border-b border-ink text-left text-[8.5pt] text-muted">
      <th class="pb-2.5 font-normal">Product</th><th class="pb-2.5 pl-4 font-normal">SKU</th><th class="pb-2.5 pl-4 text-right font-normal">Qty</th><th class="pb-2.5 pl-3 font-normal">Unit</th>
      <th class="pb-2.5 pl-4 text-right font-normal">Unit cost</th><th class="pb-2.5 pl-4 text-right font-normal">Amount</th>
    </tr>
  </thead>
  <tbody>
    <tr th:each="l : ${lines}" class="break-inside-avoid border-b border-line">
      <td class="py-3 text-ink" th:text="${l.description}">Item</td>
      <td class="py-3 pl-4" th:text="${l.sku}">SKU</td>
      <td class="py-3 pl-4 text-right tabular-nums" th:text="${l.qty}">1</td>
      <td class="py-3 pl-3" th:text="${l.unit}">PC</td>
      <td class="py-3 pl-4 text-right tabular-nums" th:text="${#numbers.formatDecimal(l.unitCost, 1, 'COMMA', 2, 'POINT')}">0.00</td>
      <td class="py-3 pl-4 text-right tabular-nums text-ink" th:text="${#numbers.formatDecimal(l.lineTotal, 1, 'COMMA', 2, 'POINT')}">0.00</td>
    </tr>
  </tbody>
</table>

<div class="mt-10 ml-auto w-[64%] break-inside-avoid">
  <div class="flex items-baseline justify-between gap-6 rounded-[1.5mm] bg-ink px-5 py-4">
    <span class="font-semibold text-white">Total</span>
    <span class="text-[16pt] font-bold tabular-nums whitespace-nowrap text-brand-yellow"
          th:text="|PHP ${#numbers.formatDecimal(total, 1, 'COMMA', 2, 'POINT')}|">0</span>
  </div>
</div>

<section th:if="${notes != ''}" class="mt-12 break-inside-avoid">
  <div class="mb-2 text-[8.5pt] text-muted">Notes</div>
  <div class="max-w-[150mm] whitespace-pre-line" th:text="${notes}">notes</div>
</section>
</body>
</html>
