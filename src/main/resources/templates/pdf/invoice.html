<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<style>@page { size: A4; margin: 20mm 18mm; }</style>
</head>
<body class="text-[10pt] leading-relaxed text-body">
<div th:if="${voided != ''}" class="fixed top-[90mm] left-[20mm] -rotate-30 text-[120pt] font-bold text-red-600/25">VOID</div>
<div th:if="${voided != ''}" class="mb-6 font-bold text-red-700">VOID: <span th:text="${voidReason}">reason</span></div>

<header th:replace="~{fragments/parts :: letterhead('SALES INVOICE', ${number})}"></header>

<section class="mb-12 grid grid-cols-[1fr_1fr_50mm] gap-10">
  <div th:replace="~{fragments/parts :: company}"></div>
  <div>
    <div class="mb-2 text-[8.5pt] text-muted">Sold to</div>
    <div class="font-semibold text-ink" th:text="${customer.name}">Name</div>
    <div class="mt-1" th:text="${customer.address}">Address</div>
    <div class="mt-1" th:if="${customer.tin != ''}">TIN <span th:text="${customer.tin}">TIN</span></div>
  </div>
  <dl class="space-y-2">
    <div class="flex justify-between gap-4"><dt class="text-muted">Date</dt><dd class="text-ink" th:text="${date}">date</dd></div>
    <div class="flex justify-between gap-4"><dt class="text-muted">Due</dt><dd class="text-ink" th:text="${dueDate}">date</dd></div>
    <div class="flex justify-between gap-4"><dt class="text-muted">Terms</dt><dd class="text-right text-ink" th:text="${paymentTerms}">Net 30</dd></div>
  </dl>
</section>

<table class="w-full">
  <thead>
    <tr class="border-b border-ink text-left text-[8.5pt] text-muted">
      <th class="pb-2.5 font-normal">Description</th><th class="pb-2.5 pl-4 text-right font-normal">Qty</th><th class="pb-2.5 pl-3 font-normal">Unit</th>
      <th class="pb-2.5 pl-4 text-right font-normal">Unit price</th><th class="pb-2.5 pl-4 text-right font-normal">Amount</th>
    </tr>
  </thead>
  <tbody>
    <tr th:each="l : ${lines}" class="break-inside-avoid border-b border-line">
      <td class="py-3 text-ink" th:text="${l.description}">Item</td>
      <td class="py-3 pl-4 text-right tabular-nums" th:text="${l.qty}">1</td>
      <td class="py-3 pl-3" th:text="${l.unit}">PC</td>
      <td class="py-3 pl-4 text-right tabular-nums" th:text="${#numbers.formatDecimal(l.unitPrice, 1, 'COMMA', 2, 'POINT')}">0.00</td>
      <td class="py-3 pl-4 text-right tabular-nums text-ink" th:text="${#numbers.formatDecimal(l.lineTotal, 1, 'COMMA', 2, 'POINT')}">0.00</td>
    </tr>
  </tbody>
</table>

<div th:replace="~{fragments/parts :: totals('Total Amount Due')}"></div>

<div th:if="${footer != ''}" class="mt-12 text-[8.5pt] text-muted" th:text="${footer}">BIR permit text</div>

<section th:if="${!bankAccounts.isEmpty() or invoiceTerms != ''}" class="break-before-page">
  <th:block th:if="${!bankAccounts.isEmpty()}">
    <h2 class="text-[15pt] font-bold tracking-tight text-ink">Payment details</h2>
    <p class="mt-2">Please use <span class="font-semibold text-ink" th:text="${number}">SI-00000</span> as your payment reference.</p>
    <div class="mt-8 grid grid-cols-2 gap-x-12 gap-y-10">
      <div th:each="a : ${bankAccounts}" class="flex break-inside-avoid items-start gap-5">
        <img th:if="${not #strings.isEmpty(a.qr)}" th:src="${a.qr}" alt="" class="size-[32mm] shrink-0 object-contain"/>
        <div class="min-w-0">
          <div class="font-semibold text-ink whitespace-pre-line" th:text="${a.bankName}">Bank</div>
          <div class="mt-1.5" th:text="${a.accountName}">Account name</div>
          <div class="mt-1.5 tabular-nums text-ink" th:text="${a.accountNumber}">0000-0000</div>
        </div>
      </div>
    </div>
  </th:block>
  <th:block th:if="${invoiceTerms != ''}">
    <h2 class="text-[15pt] font-bold tracking-tight text-ink" th:classappend="${bankAccounts.isEmpty()} ? '' : 'mt-16'">Terms and conditions</h2>
    <div class="mt-4 max-w-[150mm] whitespace-pre-line" th:text="${invoiceTerms}">Terms</div>
  </th:block>
</section>
</body>
</html>
