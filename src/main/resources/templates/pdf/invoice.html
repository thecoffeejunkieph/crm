<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<style>@page { size: A4; margin: 16mm 15mm; }</style>
</head>
<body class="text-[10pt] leading-snug text-gray-700">
<div th:if="${voided != ''}" class="fixed top-[90mm] left-[20mm] -rotate-30 text-[120pt] font-bold text-red-600/25">VOID</div>
<div th:if="${voided != ''}" class="mb-2 font-bold text-red-700">VOID: <span th:text="${voidReason}">reason</span></div>

<header class="flex items-start justify-between gap-6 border-b-2 border-gray-900 pb-3">
  <div th:replace="~{fragments/parts :: company}"></div>
  <div class="text-right">
    <div class="text-[17pt] font-bold tracking-tight text-gray-900">SALES INVOICE</div>
    <div>No. <span class="font-semibold text-gray-900" th:text="${number}">SI-00000</span></div>
    <div>Date: <span th:text="${date}">date</span></div>
    <div>Due: <span th:text="${dueDate}">date</span></div>
  </div>
</header>

<section class="my-4 rounded border border-gray-300 p-3">
  <div><b class="text-gray-900">Sold to:</b> <span th:text="${customer.name}">Name</span></div>
  <div>TIN: <span th:text="${customer.tin}">TIN</span></div>
  <div>Address: <span th:text="${customer.address}">Address</span></div>
  <div>Payment terms: <span th:text="${paymentTerms}">Net 30</span></div>
</section>

<table class="w-full">
  <thead>
    <tr class="border-b border-gray-500 bg-gray-100 text-left text-gray-900">
      <th class="p-1.5">Description</th><th class="p-1.5 text-right">Qty</th><th class="p-1.5">Unit</th>
      <th class="p-1.5 text-right">Unit price</th><th class="p-1.5 text-right">Amount</th>
    </tr>
  </thead>
  <tbody>
    <tr th:each="l : ${lines}" class="break-inside-avoid border-b border-gray-200">
      <td class="p-1.5" th:text="${l.description}">Item</td>
      <td class="p-1.5 text-right" th:text="${l.qty}">1</td>
      <td class="p-1.5" th:text="${l.unit}">PC</td>
      <td class="p-1.5 text-right" th:text="${#numbers.formatDecimal(l.unitPrice, 1, 'COMMA', 2, 'POINT')}">0.00</td>
      <td class="p-1.5 text-right" th:text="${#numbers.formatDecimal(l.lineTotal, 1, 'COMMA', 2, 'POINT')}">0.00</td>
    </tr>
  </tbody>
</table>

<table th:replace="~{fragments/parts :: totals('Total Amount Due')}"></table>

<div th:if="${footer != ''}" class="mt-4 text-[8.5pt] text-gray-500" th:text="${footer}">BIR permit text</div>
</body>
</html>
