<!--/* Generated from tailwind/mail/payment-received.html by `npm run build` in tailwind/. Edit that file, not this one. */-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: email(|We received PHP ${amount} for order ${number}. Thank you.|, ~{::content})}">
<body>
<div th:fragment="content">
  <p th:replace="~{parts :: eyebrow('Payment received')}"></p>
  <h1 th:replace="~{parts :: title('Thank you for your payment')}"></h1>
  <p style="margin-top: 16px; margin-bottom: 0">Hello,</p>
  <p style="margin-top: 12px; margin-bottom: 0">We received your payment for order <b th:text="${number}" style="font-weight: 600; white-space: nowrap; color: #0d2245">SO-00000</b>.</p>
  <table role="presentation" cellpadding="0" cellspacing="0" style="margin-top: 24px; width: 100%; border-collapse: separate; border-radius: 6px; background-color: #f6f7f9" width="100%">
    <tr><td style="padding-left: 20px; padding-right: 20px; padding-top: 16px; padding-bottom: 16px">
      <table role="presentation" cellpadding="0" cellspacing="0" style="width: 100%; border-collapse: collapse; font-size: 14px; line-height: 22px" width="100%">
        <tr><td style="padding-top: 4px; padding-bottom: 4px; color: #667286">Amount paid</td><td align="right" th:text="|PHP ${amount}|" style="padding-top: 4px; padding-bottom: 4px; text-align: right; font-weight: 600; color: #0d2245">PHP 0.00</td></tr>
        <tr><td style="padding-top: 4px; padding-bottom: 4px; color: #667286">Method</td><td align="right" th:text="${#strings.capitalizeWords(#strings.toLowerCase(#strings.replace(method, '_', ' ')))}" style="padding-top: 4px; padding-bottom: 4px; text-align: right; color: #0d2245">Bank Transfer</td></tr>
        <tr><td style="padding-top: 4px; padding-bottom: 4px; color: #667286">Received on</td><td align="right" th:text="${receivedOn}" style="padding-top: 4px; padding-bottom: 4px; text-align: right; color: #0d2245">2026-01-01</td></tr>
        <tr><td style="border-style: solid; border-width: 0; border-top-style: solid; border-top-width: 1px; border-color: #dde2ea; padding-top: 12px; color: #667286">Remaining balance</td><td align="right" th:text="|PHP ${balance}|" style="border-style: solid; border-width: 0; border-top-style: solid; border-top-width: 1px; border-color: #dde2ea; padding-top: 12px; text-align: right; font-weight: 600; color: #0d2245">PHP 0.00</td></tr>
      </table>
    </td></tr>
  </table>
  <table th:replace="~{parts :: button(${link}, 'View your payments')}"></table>
</div>
</body>
</html>
