<!--/* Generated from tailwind/mail/quote-sent.html by `npm run build` in tailwind/. Edit that file, not this one. */-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: email(|Quotation ${number}, valid until ${validUntil}. PDF attached.|, ~{::content})}">
<body>
<div th:fragment="content">
  <p th:replace="~{parts :: eyebrow('Quotation')}"></p>
  <h1 th:replace="~{parts :: title(|Quotation ${number}|)}"></h1>
  <p style="margin-top: 16px; margin-bottom: 0">Hello,</p>
  <p style="margin-top: 12px; margin-bottom: 0"><span th:text="${company}">The Coffee Junkie</span> sent you a quotation. The PDF is
    attached, and you can review and accept it in your portal.</p>
  <table role="presentation" cellpadding="0" cellspacing="0" style="margin-top: 24px; width: 100%; border-collapse: separate; border-radius: 6px; background-color: #f6f7f9" width="100%">
    <tr><td style="padding-left: 20px; padding-right: 20px; padding-top: 16px; padding-bottom: 16px">
      <table role="presentation" cellpadding="0" cellspacing="0" style="width: 100%; border-collapse: collapse; font-size: 14px; line-height: 22px" width="100%">
        <tr><td style="padding-top: 4px; padding-bottom: 4px; color: #667286">Quotation</td><td align="right" th:text="${number}" style="padding-top: 4px; padding-bottom: 4px; text-align: right; font-weight: 600; color: #0d2245">SO-00-00000</td></tr>
        <tr><td style="padding-top: 4px; padding-bottom: 4px; color: #667286">Valid until</td><td align="right" th:text="${validUntil}" style="padding-top: 4px; padding-bottom: 4px; text-align: right; font-weight: 600; color: #0d2245">2026-01-01</td></tr>
      </table>
    </td></tr>
  </table>
  <table th:replace="~{parts :: button(${link}, 'Review quotation')}"></table>
</div>
</body>
</html>
