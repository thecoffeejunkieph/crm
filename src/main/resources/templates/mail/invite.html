<!--/* Generated from tailwind/mail/invite.html by `npm run build` in tailwind/. Edit that file, not this one. */-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: email(|Set your password to start using ${company}.|, ~{::content})}">
<body>
<div th:fragment="content">
  <p th:replace="~{parts :: eyebrow('Invitation')}"></p>
  <h1 th:replace="~{parts :: title(|Welcome to ${company}|)}"></h1>
  <p style="margin-top: 16px; margin-bottom: 0">Hi <span th:text="${name}">there</span>,</p>
  <p style="margin-top: 12px; margin-bottom: 0">You have been invited to <span th:text="${company}">The Coffee Junkie</span>. Set your
    password to get started.</p>
  <table th:replace="~{parts :: button(${link}, 'Accept invitation')}"></table>
  <p style="margin-top: 28px; margin-bottom: 0; font-size: 14px; line-height: 22px; color: #667286">This link works once and expires in 24 hours.</p>
</div>
</body>
</html>
