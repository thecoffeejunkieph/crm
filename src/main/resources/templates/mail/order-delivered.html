<!--/* Generated from tailwind/mail/order-delivered.html by `npm run build` in tailwind/. Edit that file, not this one. */-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: email(${pickup} ? |Order ${orderNumber} was picked up.| : |Order ${orderNumber} was delivered.|, ~{::content})}">
<body>
<div th:fragment="content">
  <p th:replace="~{parts :: eyebrow(${pickup} ? 'Picked up' : 'Delivered')}"></p>
  <h1 th:replace="~{parts :: title(${pickup} ? |Order ${orderNumber} was picked up| : |Order ${orderNumber} was delivered|)}"></h1>
  <p style="margin-top: 16px; margin-bottom: 0">Hello,</p>
  <p style="margin-top: 12px; margin-bottom: 0"><span th:text="${pickup} ? 'Your order was picked up by' : 'Your order was delivered and received by'">Your
    order was delivered and received by</span> <b th:text="${receiverName}" style="font-weight: 600; white-space: nowrap; color: #0d2245">name</b> on
    <span th:text="${deliveredAt}">date</span>. Thank you for ordering from <span th:text="${company}">The Coffee Junkie</span>.</p>
  <table role="presentation" cellpadding="0" cellspacing="0" style="margin-top: 24px; width: 100%; border-collapse: collapse; font-size: 14px; line-height: 22px" width="100%">
    <tr>
      <th align="left" style="border-style: solid; border-width: 0; border-bottom-style: solid; border-bottom-width: 1px; border-color: #dde2ea; padding-bottom: 8px; text-align: left; font-size: 12px; line-height: 18px; font-weight: 600; letter-spacing: .08em; color: #667286; text-transform: uppercase">Item</th>
      <th align="right" style="border-style: solid; border-width: 0; border-bottom-style: solid; border-bottom-width: 1px; border-color: #dde2ea; padding-bottom: 8px; padding-left: 16px; text-align: right; font-size: 12px; line-height: 18px; font-weight: 600; letter-spacing: .08em; color: #667286; text-transform: uppercase">Qty</th>
    </tr>
    <tr th:each="l : ${lines}">
      <td th:text="${l.description}" style="border-style: solid; border-width: 0; border-bottom-style: solid; border-bottom-width: 1px; border-color: #dde2ea; padding-top: 12px; padding-bottom: 12px; color: #0d2245">Item</td>
      <td align="right" th:text="|${l.qty.stripTrailingZeros().toPlainString()} ${l.unit}|" style="border-style: solid; border-width: 0; border-bottom-style: solid; border-bottom-width: 1px; border-color: #dde2ea; padding-top: 12px; padding-bottom: 12px; padding-left: 16px; text-align: right; white-space: nowrap; color: #0d2245">1 PC</td>
    </tr>
  </table>
  <p style="margin-top: 24px; margin-bottom: 0; font-size: 14px; line-height: 22px; color: #667286">The proof of <span th:text="${pickup} ? 'pickup' : 'delivery'">delivery</span>
    is attached (delivery order <span th:text="${number}">DO-00000</span>).
    <span th:if="${photosLeftOut > 0}"><span th:text="${photosLeftOut}">1</span> more photo(s) were too large to
    attach; reply to this email if you would like a copy.</span></p>
  <table th:replace="~{parts :: button(${link}, 'View your order')}"></table>
</div>
</body>
</html>
