<!--/* Generated from tailwind/mail/overdue-reminder.html by `npm run build` in tailwind/. Edit that file, not this one. */-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: email(|A friendly reminder: PHP ${total} is past due. Statement attached.|, ~{::content})}">
<body>
<div th:fragment="content">
  <p th:replace="~{parts :: eyebrow('Payment reminder')}"></p>
  <h1 th:replace="~{parts :: title('Some orders are past due')}"></h1>
  <p style="margin-top: 16px; margin-bottom: 0">Hello,</p>
  <p style="margin-top: 12px; margin-bottom: 0">This is a friendly reminder that the following orders are past due. Your statement of account
    is attached.</p>
  <table role="presentation" cellpadding="0" cellspacing="0" style="margin-top: 24px; width: 100%; border-collapse: collapse; font-size: 14px; line-height: 22px" width="100%">
    <tr>
      <th align="left" style="border-style: solid; border-width: 0; border-bottom-style: solid; border-bottom-width: 1px; border-color: #dde2ea; padding-bottom: 8px; text-align: left; font-size: 12px; line-height: 18px; font-weight: 600; letter-spacing: .08em; color: #667286; text-transform: uppercase">Order</th>
      <th align="left" style="border-style: solid; border-width: 0; border-bottom-style: solid; border-bottom-width: 1px; border-color: #dde2ea; padding-bottom: 8px; padding-left: 12px; text-align: left; font-size: 12px; line-height: 18px; font-weight: 600; letter-spacing: .08em; color: #667286; text-transform: uppercase">Due</th>
      <th align="right" style="border-style: solid; border-width: 0; border-bottom-style: solid; border-bottom-width: 1px; border-color: #dde2ea; padding-bottom: 8px; padding-left: 12px; text-align: right; font-size: 12px; line-height: 18px; font-weight: 600; letter-spacing: .08em; color: #667286; text-transform: uppercase">Days late</th>
      <th align="right" style="border-style: solid; border-width: 0; border-bottom-style: solid; border-bottom-width: 1px; border-color: #dde2ea; padding-bottom: 8px; padding-left: 12px; text-align: right; font-size: 12px; line-height: 18px; font-weight: 600; letter-spacing: .08em; color: #667286; text-transform: uppercase">Balance</th>
    </tr>
    <tr th:each="i : ${items}">
      <td th:text="${i.number}" style="border-style: solid; border-width: 0; border-bottom-style: solid; border-bottom-width: 1px; border-color: #dde2ea; padding-top: 12px; padding-bottom: 12px; white-space: nowrap; color: #0d2245">SO-00000</td>
      <td th:text="${i.dueDate}" style="border-style: solid; border-width: 0; border-bottom-style: solid; border-bottom-width: 1px; border-color: #dde2ea; padding-top: 12px; padding-bottom: 12px; padding-left: 12px; white-space: nowrap">2026-01-01</td>
      <td align="right" th:text="${i.days}" style="border-style: solid; border-width: 0; border-bottom-style: solid; border-bottom-width: 1px; border-color: #dde2ea; padding-top: 12px; padding-bottom: 12px; padding-left: 12px; text-align: right; white-space: nowrap">1</td>
      <td align="right" th:text="${i.balance}" style="border-style: solid; border-width: 0; border-bottom-style: solid; border-bottom-width: 1px; border-color: #dde2ea; padding-top: 12px; padding-bottom: 12px; padding-left: 12px; text-align: right; white-space: nowrap; color: #0d2245">0.00</td>
    </tr>
    <tr>
      <td colspan="3" style="padding-top: 16px; font-weight: 600; color: #0d2245">Total overdue</td>
      <td align="right" th:text="|PHP ${total}|" style="padding-top: 16px; padding-left: 12px; text-align: right; font-weight: 700; white-space: nowrap; color: #0d2245">PHP 0.00</td>
    </tr>
  </table>
  <p style="margin-top: 24px; margin-bottom: 0">Already paid? Upload your proof of payment in the customer portal and we will match it.</p>
  <table th:replace="~{parts :: button(${link}, 'Upload proof of payment')}"></table>
</div>
</body>
</html>
