<!--/* Generated from tailwind/mail/password-reset.html by `npm run build` in tailwind/. Edit that file, not this one. */-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: email('Use this link to choose a new password.', ~{::content})}">
<body>
<div th:fragment="content">
  <p th:replace="~{parts :: eyebrow('Password reset')}"></p>
  <h1 th:replace="~{parts :: title('Choose a new password')}"></h1>
  <p style="margin-top: 16px; margin-bottom: 0">We received a request to reset your <span th:text="${company}">The Coffee Junkie</span>
    password.</p>
  <table th:replace="~{parts :: button(${link}, 'Reset password')}"></table>
  <p style="margin-top: 28px; margin-bottom: 0; font-size: 14px; line-height: 22px; color: #667286">This link works once and expires in 1 hour. If you did not ask for this,
    you can ignore this email and your password stays the same.</p>
</div>
</body>
</html>
