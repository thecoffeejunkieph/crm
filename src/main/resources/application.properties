spring.application.name=crm-service

# Which environment profile to load: dev, staging, or prod. Set via env var per deployment.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Logging - include the per-request correlation id (see RequestLoggingInterceptor)
# in every log line so a reported error/requestId can be traced back through the logs.
logging.level.root=INFO
logging.level.ph.thecoffeejunkie.crm=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [reqId=%X{requestId}] %logger{36} - %msg%n

spring.output.ansi.enabled=ALWAYS

# Generated files (e.g. quotation PDFs) are written to this directory on disk, outside the
# packaged jar, so they survive restarts/redeploys. They are served publicly under the
# app.storage.public-path URL prefix, mirroring a classpath "static" folder.
app.storage.public-path=/static

# Shown on generated quotation PDFs and emails - update to your real business details.
app.company.name=The Coffee Junkie
app.company.address=Unit 316, 3rd Floor, GD Plaza Novaliches\nQuezon City, Metro Manila, Philippines
app.company.email=info@thecoffeejunkie.ph
app.company.phone=+63 900 000 0000
app.company.tin=123-456-789

# Bank account shown on generated invoice PDFs for customer payment - the account itself
# is environment-specific and lives in each application-{env}.properties, sourced from
# INVOICE_BANK_* env vars.

# SMTP transport settings shared across environments - the account itself (username/password)
# is environment-specific and lives in each application-{env}.properties.
spring.mail.host=smtp.hostinger.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Validity window for the accept/reject link tokens sent in quotation emails.
quotation.response.token-validity-days=30

# Validity window for the proof-of-payment upload link tokens sent in invoice emails.
invoice.payment.token-validity-days=60

# Size limits for file uploads (proof-of-payment, proof-of-pickup, proof-of-delivery).
# max-file-size applies per file; max-request-size caps the whole multipart request
# (raised to allow multiple proof files per delivery order upload).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
