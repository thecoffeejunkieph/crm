spring.application.name=crm-service

spring.datasource.url=jdbc:mysql://localhost:3306/crm_db
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

auth.secret-key=solsticecoffee.ph127897asdkjal6-aksdjlafjsgsd0-f9adalka;sf=
encryption.salt=secretkeyngsolsticecoffee1234567890

# Logging - include the per-request correlation id (see RequestLoggingInterceptor)
# in every log line so a reported error/requestId can be traced back through the logs.
logging.level.root=INFO
logging.level.ph.thecoffeejunkie.crm=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [reqId=%X{requestId}] %logger{36} - %msg%n

spring.output.ansi.enabled=ALWAYS

# Generated files (e.g. quotation PDFs) are written to this directory on disk, outside the
# packaged jar, so they survive restarts/redeploys. They are served publicly under the
# app.storage.public-path URL prefix, mirroring a classpath "static" folder.
app.storage.root-dir=${PDF_STORAGE_DIR:./storage}
app.storage.public-path=/static

# Shown on generated quotation PDFs and emails - update to your real business details.
app.company.name=The Coffee Junkie
app.company.address=Unit 316, 3rd Floor, GD Plaza Novaliches\nQuezon City, Metro Manila, Philippines
app.company.email=info@thecoffeejunkie.ph
app.company.phone=+63 900 000 0000

# Public base URL of this API, used to build the absolute accept/reject links embedded
# in outgoing quotation emails (must be reachable by the customer clicking the link).
app.base-url=${APP_BASE_URL:http://localhost:8080}

# SMTP settings for outgoing quotation emails - populate via env vars, do not commit real credentials.
spring.mail.host=smtp.hostinger.com
spring.mail.port=587
spring.mail.username=sales@thecoffeejunkie.ph
spring.mail.password=R@ymond13ize
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Signing key and validity window for the accept/reject link tokens sent in quotation emails.
quotation.response.secret-key=${QUOTATION_RESPONSE_SECRET:solsticecoffee.quotation-response.change-me-in-prod}
quotation.response.token-validity-days=30