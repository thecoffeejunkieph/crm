# Production. No hardcoded secrets or fallbacks here - every sensitive/environment-specific
# value must be supplied via env var, so a missing one fails startup loudly instead of
# silently falling back to a dev/staging value. See .env.prod.example for the full list.

spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/crm
spring.datasource.username=${DB_APP_USERNAME}
spring.datasource.password=${DB_APP_PASSWORD}
spring.flyway.user=${DB_OWNER_USERNAME}
spring.flyway.password=${DB_OWNER_PASSWORD}

encryption.salt=${ENCRYPTION_SALT}
app.security.encryption-key=${ENCRYPTION_KEY}

# MinIO object storage for uploads. endpoint is the in-network address the API calls;
# public-endpoint is the HTTPS host browsers follow presigned links to.
app.minio.endpoint=${MINIO_ENDPOINT}
app.minio.public-endpoint=${MINIO_PUBLIC_URL}
app.minio.access-key=${MINIO_ACCESS_KEY}
app.minio.secret-key=${MINIO_SECRET_KEY}

# Redis: token revocation, rate limits, locks, cache and idempotency keys.
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}

# Behind Traefik: Tomcat's RemoteIpValve trusts X-Forwarded-For only when the peer is in the private ranges
# (the docker network), so getRemoteAddr() is the real client (audit clientIp, rate limits) and a header sent
# by an arbitrary client is ignored. Keep the api unreachable except through Traefik.
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=10[.][0-9]{1,3}[.][0-9]{1,3}[.][0-9]{1,3}|192[.]168[.][0-9]{1,3}[.][0-9]{1,3}|172[.](1[6-9]|2[0-9]|3[01])[.][0-9]{1,3}[.][0-9]{1,3}|127[.][0-9]{1,3}[.][0-9]{1,3}[.][0-9]{1,3}|0:0:0:0:0:0:0:1|::1

app.session.cookie-secure=${SESSION_COOKIE_SECURE:true}
# Domain of the XSRF-TOKEN cookie so the frontend on a sibling host can read it. Every subdomain of it can read
# the token too, so all subdomains must be trusted.
app.csrf.cookie-domain=${CSRF_COOKIE_DOMAIN:}

# Public base URL of this API, used to build the absolute accept/reject links embedded
# in outgoing quotation emails (must be reachable by the customer clicking the link).
app.base-url=${APP_BASE_URL}
# Customer-facing pages (accept quotation, upload proof of payment) live in the frontend app.
app.frontend-url=${APP_FRONTEND_URL}

# Comma-separated list of origins allowed to call this API with credentials (see CorsConfig).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}


logging.structured.format.console=ecs

# Rolling log file (spec 2026-11-05 logging): daily + 100 MB, 14 days, 1 GB in all.
logging.file.name=${LOG_PATH:logs}/crm.log
logging.logback.rollingpolicy.file-name-pattern=${LOG_PATH:logs}/crm.%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=100MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=1GB
logging.structured.format.file=ecs
logging.level.ph.thecoffeejunkie.crm=INFO
