# Local development. All values default to convenient local settings so `./gradlew bootRun`
# works out of the box; override any of them via env var if your local setup differs.

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/crm_db}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

auth.secret-key=${AUTH_SECRET_KEY:solsticecoffee.ph127897asdkjal6-aksdjlafjsgsd0-f9adalka;sf=}
encryption.salt=${ENCRYPTION_SALT:secretkeyngsolsticecoffee1234567890}

# Secure flag for the jwt auth cookie. Browsers drop Secure cookies over plain HTTP, so this
# must stay false for local dev (http://localhost:5173 -> http://localhost:8080).
auth.cookie.secure=${COOKIE_SECURE:false}

# Generated files (e.g. quotation PDFs) are written to this directory on disk.
app.storage.root-dir=${PDF_STORAGE_DIR:./storage}

# Public base URL of this API, used to build the absolute accept/reject links embedded
# in outgoing quotation emails (must be reachable by the customer clicking the link).
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Comma-separated list of origins allowed to call this API with credentials (see CorsConfig).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# SMTP credentials for outgoing quotation emails - populate via env vars, do not commit real credentials.
spring.mail.username=${MAIL_USERNAME:sales@thecoffeejunkie.ph}
spring.mail.password=${MAIL_PASSWORD:R@ymond13ize}

# Signing key for the accept/reject link tokens sent in quotation emails.
quotation.response.secret-key=${QUOTATION_RESPONSE_SECRET:solsticecoffee.quotation-response.change-me-in-prod}

# Signing key for the proof-of-payment upload link tokens sent in invoice emails.
invoice.payment.secret-key=${INVOICE_PAYMENT_SECRET:solsticecoffee.invoice-payment.change-me-in-prod}

# Bank account shown on generated invoice PDFs - dummy placeholder values for local dev,
# populate via env vars for the real UnionBank account details.
app.company.bank.name=${INVOICE_BANK_NAME:UnionBank of the Philippines}
app.company.bank.account-name=${INVOICE_BANK_ACCOUNT_NAME:The Coffee Junkie}
app.company.bank.account-number=${INVOICE_BANK_ACCOUNT_NUMBER:000123456789}
app.company.bank.swift-code=${INVOICE_BANK_SWIFT_CODE:UBPHPHMM}
