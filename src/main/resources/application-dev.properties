# Local development. All values default to convenient local settings so `./gradlew bootRun`
# works out of the box; override any of them via env var if your local setup differs.

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/crm
spring.datasource.username=${DB_APP_USERNAME:crm_app}
spring.datasource.password=${DB_APP_PASSWORD:crm_app}
spring.flyway.user=${DB_OWNER_USERNAME:crm_owner}
spring.flyway.password=${DB_OWNER_PASSWORD:crm_owner}

encryption.salt=${ENCRYPTION_SALT:secretkeyngsolsticecoffee1234567890}
app.security.encryption-key=${ENCRYPTION_KEY:dev-only-encryption-key-change-me}

# MinIO object storage for uploads (pictures, proofs). endpoint is what the API calls;
# public-endpoint is what the browser follows presigned links to. Same host for local dev.
app.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.minio.public-endpoint=${MINIO_PUBLIC_URL:http://localhost:9000}
app.minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
app.minio.secret-key=${MINIO_SECRET_KEY:minioadmin}

# Redis: token revocation, rate limits, locks, cache and idempotency keys.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:devredis}

# Public base URL of this API, used to build the absolute accept/reject links embedded
# in outgoing quotation emails (must be reachable by the customer clicking the link).
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Comma-separated list of origins allowed to call this API with credentials (see CorsConfig).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Mail goes to Mailpit (docker-compose.local.yml): SMTP 1025, UI http://localhost:8025. No auth, no TLS.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Local dev runs over plain http, so the session cookie cannot be Secure.
app.session.cookie-secure=false

# Also print invite / password-reset links in the log.
app.mail.log-links=true

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Rolling log file (spec 2026-11-05 logging): daily + 100 MB, 14 days, 1 GB in all.
logging.file.name=${LOG_PATH:logs}/crm.log
logging.logback.rollingpolicy.file-name-pattern=${LOG_PATH:logs}/crm.%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=100MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=1GB

# Readable lines with the request or job id (spec 2026-11-05 logging).
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [reqId=%X{requestId}%X{jobId}] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [reqId=%X{requestId}%X{jobId}] %logger{36} - %msg%n

# Attachments: 20 MB a file, up to 10 a request (spec 2026-11-05 attachments).
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=200MB
