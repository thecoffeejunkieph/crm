<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: email(|Order ${orderNumber} is out for delivery.|, ~{::content})}">
<body>
<div th:fragment="content">
  <p th:replace="~{parts :: eyebrow('Out for delivery')}"></p>
  <h1 th:replace="~{parts :: title(|Order ${orderNumber} is on its way|)}"></h1>
  <p class="mt-4 mb-0">Hello,</p>
  <p class="mt-3 mb-0">Your order from <span th:text="${company}">The Coffee Junkie</span> is out for delivery.</p>
  <table role="presentation" class="mt-6 w-full border-separate rounded-md bg-panel" cellpadding="0" cellspacing="0">
    <tr><td class="px-5 py-4">
      <table role="presentation" class="w-full border-collapse text-sm" cellpadding="0" cellspacing="0">
        <tr><td class="py-1 pr-4 align-top text-muted">Delivery order</td><td class="py-1 text-right font-semibold text-ink" align="right" th:text="${number}">DO-00000</td></tr>
        <tr th:if="${shipTo != ''}"><td class="py-1 pr-4 align-top text-muted">Delivering to</td><td class="py-1 text-right text-ink" align="right" th:text="${shipTo}">address</td></tr>
      </table>
    </td></tr>
  </table>
  <table role="presentation" class="mt-6 w-full border-collapse text-sm" cellpadding="0" cellspacing="0">
    <tr>
      <th class="border-0 border-b border-line pb-2 text-left text-xs font-semibold uppercase tracking-wide text-muted" align="left">Item</th>
      <th class="border-0 border-b border-line pb-2 pl-4 text-right text-xs font-semibold uppercase tracking-wide text-muted" align="right">Qty</th>
    </tr>
    <tr th:each="l : ${lines}">
      <td class="border-0 border-b border-line py-3 text-ink" th:text="${l.description}">Item</td>
      <td class="border-0 border-b border-line py-3 pl-4 text-right whitespace-nowrap text-ink" align="right"
          th:text="|${l.qty.stripTrailingZeros().toPlainString()} ${l.unit}|">1 PC</td>
    </tr>
  </table>
  <table th:replace="~{parts :: button(${link}, 'Track your order')}"></table>
</div>
</body>
</html>
