<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: email(|We received PHP ${amount} for order ${number}. Thank you.|, ~{::content})}">
<body>
<div th:fragment="content">
  <p th:replace="~{parts :: eyebrow('Payment received')}"></p>
  <h1 th:replace="~{parts :: title('Thank you for your payment')}"></h1>
  <p class="mt-4 mb-0">Hello,</p>
  <p class="mt-3 mb-0">We received your payment for order <b class="font-semibold whitespace-nowrap text-ink" th:text="${number}">SO-00000</b>.</p>
  <table role="presentation" class="mt-6 w-full border-separate rounded-md bg-panel" cellpadding="0" cellspacing="0">
    <tr><td class="px-5 py-4">
      <table role="presentation" class="w-full border-collapse text-sm" cellpadding="0" cellspacing="0">
        <tr><td class="py-1 text-muted">Amount paid</td><td class="py-1 text-right font-semibold text-ink" align="right" th:text="|PHP ${amount}|">PHP 0.00</td></tr>
        <tr><td class="py-1 text-muted">Method</td><td class="py-1 text-right text-ink" align="right"
                th:text="${#strings.capitalizeWords(#strings.toLowerCase(#strings.replace(method, '_', ' ')))}">Bank Transfer</td></tr>
        <tr><td class="py-1 text-muted">Received on</td><td class="py-1 text-right text-ink" align="right" th:text="${receivedOn}">2026-01-01</td></tr>
        <tr><td class="border-0 border-t border-line pt-3 text-muted">Remaining balance</td><td class="border-0 border-t border-line pt-3 text-right font-semibold text-ink" align="right" th:text="|PHP ${balance}|">PHP 0.00</td></tr>
      </table>
    </td></tr>
  </table>
  <table th:replace="~{parts :: button(${link}, 'View your payments')}"></table>
</div>
</body>
</html>
