<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: email(|Order ${number} is confirmed. Total PHP ${total}.|, ~{::content})}">
<body>
<div th:fragment="content">
  <p th:replace="~{parts :: eyebrow('Order confirmed')}"></p>
  <h1 th:replace="~{parts :: title(|Order ${number} is confirmed|)}"></h1>
  <p class="mt-4 mb-0">Hello,</p>
  <p class="mt-3 mb-0">Thank you for your order with <span th:text="${company}">The Coffee Junkie</span>. You can
    follow it, pay and download your documents in the customer portal.</p>
  <table role="presentation" class="mt-6 w-full border-separate rounded-md bg-panel" cellpadding="0" cellspacing="0">
    <tr><td class="px-5 py-4">
      <table role="presentation" class="w-full border-collapse text-sm" cellpadding="0" cellspacing="0">
        <tr><td class="py-1 text-muted">Order</td><td class="py-1 text-right font-semibold text-ink" align="right" th:text="${number}">SO-00000</td></tr>
        <tr><td class="py-1 text-muted">Order total</td><td class="py-1 text-right font-semibold text-ink" align="right" th:text="|PHP ${total}|">PHP 0.00</td></tr>
      </table>
    </td></tr>
  </table>
  <table th:replace="~{parts :: button(${link}, 'View your order')}"></table>
</div>
</body>
</html>
