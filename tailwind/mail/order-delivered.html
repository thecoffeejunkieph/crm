<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: email(${pickup} ? |Order ${orderNumber} was picked up.| : |Order ${orderNumber} was delivered.|, ~{::content})}">
<body>
<div th:fragment="content">
  <p th:replace="~{parts :: eyebrow(${pickup} ? 'Picked up' : 'Delivered')}"></p>
  <h1 th:replace="~{parts :: title(${pickup} ? |Order ${orderNumber} was picked up| : |Order ${orderNumber} was delivered|)}"></h1>
  <p class="mt-4 mb-0">Hello,</p>
  <p class="mt-3 mb-0"><span th:text="${pickup} ? 'Your order was picked up by' : 'Your order was delivered and received by'">Your
    order was delivered and received by</span> <b class="font-semibold whitespace-nowrap text-ink" th:text="${receiverName}">name</b> on
    <span th:text="${deliveredAt}">date</span>. Thank you for ordering from <span th:text="${company}">The Coffee Junkie</span>.</p>
  <table role="presentation" class="mt-6 w-full border-collapse text-sm" cellpadding="0" cellspacing="0">
    <tr>
      <th class="border-0 border-b border-line pb-2 text-left text-xs font-semibold uppercase tracking-wide text-muted" align="left">Item</th>
      <th class="border-0 border-b border-line pb-2 pl-4 text-right text-xs font-semibold uppercase tracking-wide text-muted" align="right">Qty</th>
    </tr>
    <tr th:each="l : ${lines}">
      <td class="border-0 border-b border-line py-3 text-ink" th:text="${l.description}">Item</td>
      <td class="border-0 border-b border-line py-3 pl-4 text-right whitespace-nowrap text-ink" align="right"
          th:text="|${l.qty.stripTrailingZeros().toPlainString()} ${l.unit}|">1 PC</td>
    </tr>
  </table>
  <p class="mt-6 mb-0 text-sm text-muted">The proof of <span th:text="${pickup} ? 'pickup' : 'delivery'">delivery</span>
    is attached (delivery order <span th:text="${number}">DO-00000</span>).
    <span th:if="${photosLeftOut > 0}"><span th:text="${photosLeftOut}">1</span> more photo(s) were too large to
    attach; reply to this email if you would like a copy.</span></p>
  <table th:replace="~{parts :: button(${link}, 'View your order')}"></table>
</div>
</body>
</html>
