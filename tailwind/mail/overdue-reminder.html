<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: email(|A friendly reminder: PHP ${total} is past due. Statement attached.|, ~{::content})}">
<body>
<div th:fragment="content">
  <p th:replace="~{parts :: eyebrow('Payment reminder')}"></p>
  <h1 th:replace="~{parts :: title('Some orders are past due')}"></h1>
  <p class="mt-4 mb-0">Hello,</p>
  <p class="mt-3 mb-0">This is a friendly reminder that the following orders are past due. Your statement of account
    is attached.</p>
  <table role="presentation" class="mt-6 w-full border-collapse text-sm" cellpadding="0" cellspacing="0">
    <tr>
      <th class="border-0 border-b border-line pb-2 text-left text-xs font-semibold uppercase tracking-wide text-muted" align="left">Order</th>
      <th class="border-0 border-b border-line pb-2 pl-3 text-left text-xs font-semibold uppercase tracking-wide text-muted" align="left">Due</th>
      <th class="border-0 border-b border-line pb-2 pl-3 text-right text-xs font-semibold uppercase tracking-wide text-muted" align="right">Days late</th>
      <th class="border-0 border-b border-line pb-2 pl-3 text-right text-xs font-semibold uppercase tracking-wide text-muted" align="right">Balance</th>
    </tr>
    <tr th:each="i : ${items}">
      <td class="border-0 border-b border-line py-3 whitespace-nowrap text-ink" th:text="${i.number}">SO-00000</td>
      <td class="border-0 border-b border-line py-3 pl-3 whitespace-nowrap" th:text="${i.dueDate}">2026-01-01</td>
      <td class="border-0 border-b border-line py-3 pl-3 text-right whitespace-nowrap" align="right" th:text="${i.days}">1</td>
      <td class="border-0 border-b border-line py-3 pl-3 text-right whitespace-nowrap text-ink" align="right" th:text="${i.balance}">0.00</td>
    </tr>
    <tr>
      <td class="pt-4 font-semibold text-ink" colspan="3">Total overdue</td>
      <td class="pt-4 pl-3 text-right font-bold whitespace-nowrap text-ink" align="right" th:text="|PHP ${total}|">PHP 0.00</td>
    </tr>
  </table>
  <p class="mt-6 mb-0">Already paid? Upload your proof of payment in the customer portal and we will match it.</p>
  <table th:replace="~{parts :: button(${link}, 'Upload proof of payment')}"></table>
</div>
</body>
</html>
