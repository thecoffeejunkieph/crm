<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: email(|Quotation ${number}, valid until ${validUntil}. PDF attached.|, ~{::content})}">
<body>
<div th:fragment="content">
  <p th:replace="~{parts :: eyebrow('Quotation')}"></p>
  <h1 th:replace="~{parts :: title(|Quotation ${number}|)}"></h1>
  <p class="mt-4 mb-0">Hello,</p>
  <p class="mt-3 mb-0"><span th:text="${company}">The Coffee Junkie</span> sent you a quotation. The PDF is
    attached, and you can review and accept it in your portal.</p>
  <table role="presentation" class="mt-6 w-full border-separate rounded-md bg-panel" cellpadding="0" cellspacing="0">
    <tr><td class="px-5 py-4">
      <table role="presentation" class="w-full border-collapse text-sm" cellpadding="0" cellspacing="0">
        <tr><td class="py-1 text-muted">Quotation</td><td class="py-1 text-right font-semibold text-ink" align="right" th:text="${number}">SO-00-00000</td></tr>
        <tr><td class="py-1 text-muted">Valid until</td><td class="py-1 text-right font-semibold text-ink" align="right" th:text="${validUntil}">2026-01-01</td></tr>
      </table>
    </td></tr>
  </table>
  <table th:replace="~{parts :: button(${link}, 'Review quotation')}"></table>
</div>
</body>
</html>
