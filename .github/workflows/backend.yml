name: backend

on:
  pull_request:
  push:
    branches: ['redesign/**', master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # Testcontainers starts Postgres, Redis and MinIO from the runner's Docker; no secrets needed.
      - run: ./gradlew test
