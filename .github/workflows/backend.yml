name: backend

on:
  pull_request:
  push:
    branches: ['redesign/**', master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # Testcontainers starts Postgres and MinIO from the runner's Docker; no secrets needed.
      # PDF tests print with Chromium; the version must match playwright in build.gradle.
      - run: npx -y playwright@1.64.0 install --with-deps chromium
      - run: ./gradlew test
